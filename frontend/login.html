<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaSafe - Secure Portal Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #0284c7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .login-card {
            background: #ffffff;
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="brand-icon mx-auto mb-3" style="width: 50px; height: 50px; font-size: 1.5rem;">
                    <i class="fa-solid fa-droplet"></i>
                </div>
                <h3 class="fw-bold text-dark mb-1">AquaSafe Portal</h3>
                <p class="text-muted small">Water-Borne Disease Risk Intelligence System</p>
            </div>

            <!-- Error alert -->
            <div class="alert alert-danger py-2 small d-none" id="loginAlert"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-user"></i></span>
                        <input type="text" class="form-control" id="loginUsername" placeholder="Enter username" value="admin" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control" id="loginPassword" placeholder="Enter password" value="admin123" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="btnLoginSubmit">
                    <span class="spinner-border spinner-border-sm me-2 d-none" id="loginSpinner"></span>
                    Sign In to AquaSafe
                </button>
            </form>

            <!-- Quick Demo Credentials Box -->
            <div class="mt-4 pt-3 border-top text-center">
                <span class="text-muted small">Quick Development Credentials:</span>
                <div class="d-flex justify-content-center gap-2 mt-2">
                    <button type="button" class="btn btn-sm btn-outline-secondary" onclick="fillCreds('admin', 'admin123')">
                        <i class="fa-solid fa-shield-halved me-1"></i> Admin (admin / admin123)
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-secondary" onclick="fillCreds('analyst', 'user123')">
                        <i class="fa-solid fa-user me-1"></i> Analyst (analyst / user123)
                    </button>
                </div>
            </div>
        </div>

        <div class="bg-light px-4 py-3 text-center border-top">
            <small class="text-muted">
                AquaSafe &copy; 2026. Predictive Public Health Analytics.
            </small>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        function fillCreds(u, p) {
            document.getElementById('loginUsername').value = u;
            document.getElementById('loginPassword').value = p;
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('loginUsername').value;
            const p = document.getElementById('loginPassword').value;

            const alertEl = document.getElementById('loginAlert');
            const btn = document.getElementById('btnLoginSubmit');
            const spinner = document.getElementById('loginSpinner');

            alertEl.classList.add('d-none');
            btn.disabled = true;
            spinner.classList.remove('d-none');

            try {
                const res = await api.login(u, p);
                if (res.authenticated) {
                    api.setUser(res);
                    window.location.href = 'dashboard.html';
                } else {
                    alertEl.textContent = res.message || 'Invalid username or password';
                    alertEl.classList.remove('d-none');
                }
            } catch (err) {
                alertEl.textContent = err.message || 'Authentication service error';
                alertEl.classList.remove('d-none');
            } finally {
                btn.disabled = false;
                spinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
