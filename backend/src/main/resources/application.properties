spring.application.name=aquasafe-backend
server.port=${PORT:8080}

# Primary MySQL DataSource Configuration
aquasafe.datasource.mysql.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:aquasafe}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
aquasafe.datasource.mysql.username=${DB_USER:root}
aquasafe.datasource.mysql.password=${DB_PASSWORD:root}
aquasafe.datasource.mysql.driver-class-name=com.mysql.cj.jdbc.Driver

# H2 Fallback Configuration
aquasafe.datasource.h2.url=jdbc:h2:mem:aquasafe;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
aquasafe.datasource.h2.username=sa
aquasafe.datasource.h2.password=
aquasafe.datasource.h2.driver-class-name=org.h2.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Multipart File Upload for CSV Datasets
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# Application Specific Properties
aquasafe.ml.model-dir=ml/models/
aquasafe.ml.model-file=ml/models/random_forest_water_risk.model
aquasafe.ml.training-file=ml/training/training_dataset.arff
aquasafe.weather.api-url=${WEATHER_API_URL:https://api.open-meteo.com/v1/forecast}
aquasafe.weather.api-key=${WEATHER_API_KEY:}
aquasafe.spark.master=${SPARK_MASTER:local[*]}
aquasafe.hadoop.hdfs-uri=${HADOOP_HDFS_URI:hdfs://localhost:9000}
